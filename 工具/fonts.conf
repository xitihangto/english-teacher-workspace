<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  LibreOffice 自带 fontconfig，编译时写死配置目录 /usr/local/etc/fonts。
  该目录在 macOS 上默认不存在，于是它一个系统字体都读不到：
  中文全变空白、宋体/黑体/苹方全部"不存在"。
  pdf_tools.py 调 soffice 时会把 FONTCONFIG_FILE 指到本文件来兜底。
-->
<fontconfig>
  <!-- macOS -->
  <dir>/System/Library/Fonts</dir>
  <dir>/Library/Fonts</dir>
  <dir>~/Library/Fonts</dir>
  <dir>/System/Library/AssetsV2/com_apple_MobileAsset_Font8</dir>
  <dir>~/.fonts</dir>
  <!-- Linux（有就扫，没有就忽略） -->
  <dir>/usr/share/fonts</dir>
  <dir>/usr/local/share/fonts</dir>
  <dir>~/.local/share/fonts</dir>
  <cachedir>/tmp/wb-fontconfig-cache</cachedir>
</fontconfig>
